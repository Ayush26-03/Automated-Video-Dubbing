<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="lakeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="mountGradFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="mountGradMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="hillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="hillGradFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="640" height="360" fill="url(#skyGrad)"/>

  <!-- Clouds -->
  <path d="M60 80 Q90 50 130 70 Q160 55 190 75 Q210 95 180 110 Q140 115 100 110 Q50 105 60 80 Z" fill="#ffffff" opacity="0.85"/>
  <path d="M420 60 Q450 35 490 50 Q520 40 550 60 Q570 75 545 90 Q505 95 460 90 Q410 85 420 60 Z" fill="#ffffff" opacity="0.8"/>
  <path d="M260 90 Q290 75 320 85 Q340 100 320 110 Q280 115 250 105 Z" fill="#ffffff" opacity="0.65"/>

  <!-- Distant Mountains -->
  <polygon points="40,220 180,100 320,220" fill="url(#mountGradFar)" opacity="0.7"/>
  <polygon points="180,100 210,140 160,150" fill="#ffffff" opacity="0.9"/>
  <polygon points="260,220 380,80 500,220" fill="url(#mountGradFar)" opacity="0.8"/>
  <polygon points="380,80 410,125 360,135" fill="#ffffff" opacity="0.9"/>
  <polygon points="440,220 540,110 640,220" fill="url(#mountGradFar)" opacity="0.6"/>

  <!-- Mid Mountains -->
  <polygon points="0,240 110,130 240,240" fill="url(#mountGradMid)" opacity="0.85"/>
  <polygon points="170,240 310,120 450,240" fill="url(#mountGradMid)" opacity="0.9"/>
  <polygon points="370,240 490,140 610,240" fill="url(#mountGradMid)" opacity="0.85"/>

  <!-- Green Foothills -->
  <path d="M0 240 Q120 170 260 230 Q400 180 540 235 Q600 210 640 230 L640 360 L0 360 Z" fill="url(#hillGrad)"/>

  <!-- Lake -->
  <path d="M0 245 Q160 235 320 240 Q480 235 640 245 L640 360 L0 360 Z" fill="url(#lakeGrad)"/>

  <!-- Lake reflections -->
  <ellipse cx="280" cy="275" rx="140" ry="6" fill="#93c5fd" opacity="0.4"/>
  <ellipse cx="440" cy="295" rx="90" ry="4" fill="#bae6fd" opacity="0.35"/>
  <ellipse cx="180" cy="315" rx="110" ry="5" fill="#e0f2fe" opacity="0.3"/>

  <!-- Forefront Green Hill Left -->
  <path d="M0 260 Q80 250 160 280 Q200 300 220 360 L0 360 Z" fill="url(#hillGradFront)"/>

  <!-- Forefront Village Shore Right -->
  <path d="M420 360 Q460 275 560 265 Q600 265 640 270 L640 360 Z" fill="url(#hillGradFront)"/>

  <!-- Village Cottages on shore -->
  <!-- Cottage 1 -->
  <polygon points="100,250 130,230 160,250" fill="#b91c1c"/>
  <rect x="105" y="250" width="50" height="30" fill="#fef3c7"/>
  <rect x="115" y="258" width="10" height="10" fill="#38bdf8"/>
  <rect x="135" y="262" width="10" height="18" fill="#78350f"/>

  <!-- Cottage 2 -->
  <polygon points="60,265 85,248 110,265" fill="#c2410c"/>
  <rect x="65" y="265" width="40" height="25" fill="#ffedd5"/>
  <rect x="75" y="272" width="8" height="8" fill="#38bdf8"/>

  <!-- Cottage 3 (Right Shore) -->
  <polygon points="500,260 530,240 560,260" fill="#991b1b"/>
  <rect x="505" y="260" width="50" height="28" fill="#fef08a"/>
  <rect x="515" y="268" width="10" height="10" fill="#38bdf8"/>

  <!-- Trees -->
  <circle cx="45" cy="285" r="14" fill="#14532d"/>
  <circle cx="175" cy="295" r="16" fill="#166534"/>
  <circle cx="195" cy="315" r="18" fill="#14532d"/>
  <circle cx="485" cy="280" r="15" fill="#15803d"/>
  <circle cx="580" cy="275" r="18" fill="#166534"/>
  <circle cx="615" cy="290" r="22" fill="#14532d"/>

  <!-- Small Wooden Pier / Boat -->
  <rect x="170" y="320" width="35" height="4" fill="#78350f"/>
  <polygon points="215,318 235,318 230,324 218,324" fill="#dc2626"/>
  <line x1="225" y1="318" x2="225" y2="308" stroke="#ffffff" stroke-width="1.5"/>
  <polygon points="225,308 233,313 225,315" fill="#ffffff"/>
</svg>
